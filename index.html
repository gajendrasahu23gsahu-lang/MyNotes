
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyNote - Professional Note Taking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        indigo: {
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        },
                        dim: {
                            bg: '#15202b',
                            card: '#1e2732',
                            border: '#38444d'
                        }
                    }
                }
            },
            plugins: [
                function({ addVariant }) {
                    addVariant('dim', '.dim &')
                }
            ]
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Material+Icons+Round&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-icons-round {
            font-family: 'Material Icons Round';
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
        /* Hide scrollbar */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Dim mode overrides */
        .dim {
            background-color: #15202b !important;
            color: #ffffff !important;
        }
        .dim .dark\:bg-slate-950 {
            background-color: #15202b !important;
        }
        .dim .dark\:bg-slate-950\/80 {
            background-color: rgba(21, 32, 43, 0.8) !important;
        }
        .dim .dark\:bg-slate-900 {
            background-color: #1e2732 !important;
        }
        .dim .dark\:bg-slate-900\/50 {
            background-color: rgba(30, 39, 50, 0.5) !important;
        }
        .dim .dark\:bg-slate-900\/95 {
            background-color: rgba(30, 39, 50, 0.95) !important;
        }
        .dim .dark\:bg-slate-800 {
            background-color: #273340 !important;
        }
        .dim .dark\:bg-slate-800\/50 {
            background-color: rgba(39, 51, 64, 0.5) !important;
        }
        .dim .dark\:border-slate-800 {
            border-color: #38444d !important;
        }
        .dim .dark\:border-slate-800\/50 {
            border-color: rgba(56, 68, 77, 0.5) !important;
        }
        .dim .dark\:text-slate-400 {
            color: #8b98a5 !important;
        }
        .dim .dark\:text-slate-300 {
            color: #f7f9f9 !important;
        }
        .dim .dark\:text-slate-500 {
            color: #6b7d8c !important;
        }
        .dim .dark\:text-slate-200 {
            color: #ffffff !important;
        }
        .dim .dark\:text-slate-700 {
            color: #38444d !important;
        }
        .dim .dark\:bg-slate-700 {
            background-color: #38444d !important;
        }
        
        /* Smooth theme transitions */
        * {
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.1s ease;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
